<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1300" width="1200" height="1300" role="img" aria-labelledby="diagram-title diagram-desc" lang="ja">
  <title id="diagram-title">図1  Cookieと認証の全体像</title>
  <desc id="diagram-desc">①〜⑨は処理位置の識別子。⑤⑥⑦は要求ごとに繰り返し使われる。</desc>
  <style>
        text { font-family: "Yu Gothic", "Meiryo", "Noto Sans CJK JP", sans-serif; fill: #172e42; }
        .node-title { font-size: 20px; font-weight: 700; }
        .node-body { font-size: 17px; }
        .edge-label { font-size: 16px; font-weight: 500; }
        .message-label { font-size: 16px; }
        </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#536d82" />
    </marker>
  </defs>
  <rect width="1200" height="1300" fill="#ffffff" />
  <text x="40" y="44" font-size="27" font-weight="700">図1  Cookieと認証の全体像</text>
  <text x="40" y="78" font-size="17" style="fill:#52697b">①〜⑨は処理位置の識別子。⑤⑥⑦は要求ごとに繰り返し使われる。</text>
  <g id="connections">
    <path d="M 189 216 V 288" fill="none" stroke="#536d82" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <g>
      <rect x="215.0" y="243" width="62" height="25" rx="3" fill="#fff" />
      <text x="246" y="260" text-anchor="middle" class="edge-label">読取り</text>
    </g>
    <path d="M 334 344 H 430" fill="none" stroke="#536d82" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <g>
      <rect x="359.0" y="312" width="46" height="25" rx="3" fill="#fff" />
      <text x="382" y="329" text-anchor="middle" class="edge-label">合成</text>
    </g>
    <path d="M 595 400 V 488" fill="none" stroke="#536d82" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <g>
      <rect x="459.0" y="434" width="110" height="25" rx="3" fill="#fff" />
      <text x="514" y="451" text-anchor="middle" class="edge-label">復号・読込み</text>
    </g>
    <path d="M 595 600 V 716" fill="none" stroke="#536d82" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <g>
      <rect x="599.0" y="643" width="126" height="25" rx="3" fill="#fff" />
      <text x="662" y="660" text-anchor="middle" class="edge-label">読込み済み状態</text>
    </g>
    <path d="M 700 488 V 447 H 1002 V 488" fill="none" stroke="#536d82" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)" />
    <g>
      <rect x="800.2" y="414" width="121.60000000000001" height="25" rx="3" fill="#fff" />
      <text x="861" y="431" text-anchor="middle" class="edge-label">operation開始</text>
    </g>
    <path d="M 1002 600 V 716" fill="none" stroke="#536d82" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <g>
      <rect x="1024.0" y="644" width="46" height="25" rx="3" fill="#fff" />
      <text x="1047" y="661" text-anchor="middle" class="edge-label">要求</text>
    </g>
    <path d="M 760 780 H 850" fill="none" stroke="#536d82" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <g>
      <rect x="772.8" y="748" width="64.4" height="25" rx="3" fill="#fff" />
      <text x="805" y="765" text-anchor="middle" class="edge-label">Cookie</text>
    </g>
    <path d="M 430 780 H 334" fill="none" stroke="#536d82" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <g>
      <rect x="359.0" y="748" width="46" height="25" rx="3" fill="#fff" />
      <text x="382" y="765" text-anchor="middle" class="edge-label">差分</text>
    </g>
    <path d="M 189 716 V 454 H 385 V 344 H 430" fill="none" stroke="#536d82" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <g>
      <rect x="116.0" y="474" width="184.0" height="25" rx="3" fill="#fff" />
      <text x="208" y="491" text-anchor="middle" class="edge-label">close時に最新②と合成</text>
    </g>
    <path d="M 1155 774 H 1180 V 1154 H 1155" fill="none" stroke="#536d82" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <g>
      <rect x="1075.2" y="864" width="79.6" height="25" rx="3" fill="#fff" />
      <text x="1115" y="881" text-anchor="middle" class="edge-label">HTTP要求</text>
    </g>
    <path d="M 1002 1110 V 1032" fill="none" stroke="#536d82" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <g>
      <rect x="1014.2" y="1060" width="79.6" height="25" rx="3" fill="#fff" />
      <text x="1054" y="1077" text-anchor="middle" class="edge-label">HTTP応答</text>
    </g>
    <path d="M 850 980 H 792 V 886 H 670 V 844" fill="none" stroke="#536d82" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <g>
      <rect x="647.0" y="902" width="110" height="25" rx="3" fill="#fff" />
      <text x="702" y="919" text-anchor="middle" class="edge-label">受信時に反映</text>
    </g>
    <path d="M 595 844 V 1050" fill="none" stroke="#536d82" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)" />
    <g>
      <rect x="510.0" y="950" width="62" height="25" rx="3" fill="#fff" />
      <text x="541" y="967" text-anchor="middle" class="edge-label">コピー</text>
    </g>
    <path d="M 595 1162 V 1212" fill="none" stroke="#536d82" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)" />
  </g>
  <g id="nodes">
    <g data-node="ブラウザのCookie">
      <rect x="44" y="118" width="290" height="98" rx="9" fill="#f4f7fa" stroke="#b3c2ce" stroke-width="1.6" />
      <text x="61" y="151" class="node-title">ブラウザのCookie</text>
      <text x="61" y="180" class="node-body">元のブラウザにある状態</text>
      <text x="61" y="203" class="node-body">アプリからの書戻しはしない</text>
    </g>
    <g data-node="① ブラウザインポート">
      <rect x="44" y="288" width="290" height="112" rx="9" fill="#eef4ff" stroke="#9db8dd" stroke-width="1.6" />
      <text x="61" y="321" class="node-title">① ブラウザインポート</text>
      <text x="61" y="350" class="node-body">既存②へ合成して保存</text>
      <text x="61" y="373" class="node-body">CookieStore.import_browser()</text>
    </g>
    <g data-node="② 暗号化Cookieファイル">
      <rect x="430" y="288" width="330" height="112" rx="9" fill="#eef4ff" stroke="#9db8dd" stroke-width="1.6" />
      <text x="447" y="321" class="node-title">② 暗号化Cookieファイル</text>
      <text x="447" y="350" class="node-body">プロファイル単位で保管</text>
      <text x="447" y="373" class="node-body">cookie/cookies.v2.enc</text>
    </g>
    <g data-node="③ サービス構築・読込み">
      <rect x="430" y="488" width="330" height="112" rx="9" fill="#eef4ff" stroke="#9db8dd" stroke-width="1.6" />
      <text x="447" y="521" class="node-title">③ サービス構築・読込み</text>
      <text x="447" y="550" class="node-body">load() → baselineを取得</text>
      <text x="447" y="573" class="node-body">ファイル読込みは構築時</text>
    </g>
    <g data-node="⑤ operationの認証処理">
      <rect x="850" y="488" width="305" height="112" rx="9" fill="#f2effc" stroke="#b5a5dc" stroke-width="1.6" />
      <text x="867" y="521" class="node-title">⑤ operationの認証処理</text>
      <text x="867" y="550" class="node-body">初期化・確認・付与・更新</text>
      <text x="867" y="573" class="node-body">各operationに一つ</text>
    </g>
    <g data-node="④ 共有Cookie jar">
      <rect x="430" y="716" width="330" height="128" rx="9" fill="#eaf8f3" stroke="#84bbaa" stroke-width="1.6" />
      <text x="447" y="749" class="node-title">④ 共有Cookie jar</text>
      <text x="447" y="778" class="node-body">サービスのメモリ上で保持</text>
      <text x="447" y="801" class="node-body">通常通信・認証用通信で共有</text>
      <text x="447" y="824" class="node-body">要求ごとに再読込みしない</text>
    </g>
    <g data-node="⑥ 共有HTTPクライアント">
      <rect x="850" y="716" width="305" height="128" rx="9" fill="#eaf8f3" stroke="#84bbaa" stroke-width="1.6" />
      <text x="867" y="749" class="node-title">⑥ 共有HTTPクライアント</text>
      <text x="867" y="778" class="node-body">通常要求と認証用要求</text>
      <text x="867" y="801" class="node-body">同じCookie jarを利用</text>
    </g>
    <g data-node="⑧ サービス終了時に保存">
      <rect x="44" y="716" width="290" height="128" rx="9" fill="#eef4ff" stroke="#9db8dd" stroke-width="1.6" />
      <text x="61" y="749" class="node-title">⑧ サービス終了時に保存</text>
      <text x="61" y="778" class="node-body">baselineとの差分だけを反映</text>
      <text x="61" y="801" class="node-body">最新②を読んで合成・保存</text>
    </g>
    <g data-node="⑦ Set-Cookieを反映">
      <rect x="850" y="928" width="305" height="104" rx="9" fill="#eaf8f3" stroke="#84bbaa" stroke-width="1.6" />
      <text x="867" y="961" class="node-title">⑦ Set-Cookieを反映</text>
      <text x="867" y="990" class="node-body">応答の受信時に④を更新</text>
      <text x="867" y="1013" class="node-body">認証分類より先に反映</text>
    </g>
    <g data-node="サイトのサーバー">
      <rect x="850" y="1110" width="305" height="90" rx="9" fill="#f4f7fa" stroke="#b3c2ce" stroke-width="1.6" />
      <text x="867" y="1143" class="node-title">サイトのサーバー</text>
      <text x="867" y="1172" class="node-body">ログイン・通常応答</text>
    </g>
    <g data-node="⑨ 検査用にコピー">
      <rect x="430" y="1050" width="330" height="112" rx="9" fill="#fff6e8" stroke="#d5b984" stroke-width="1.6" />
      <text x="447" y="1083" class="node-title">⑨ 検査用にコピー</text>
      <text x="447" y="1112" class="node-body">inspect・workflow計画</text>
      <text x="447" y="1135" class="node-body">元の④や②へ戻さない</text>
    </g>
  </g>
  <text x="595" y="1243" font-size="18" font-weight="700" text-anchor="middle" style="fill:#815f28">検査終了時に破棄（保存しない）</text>
</svg>