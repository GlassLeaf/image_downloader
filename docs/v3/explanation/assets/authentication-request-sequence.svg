  <g id="nodes">
    <rect x="21" y="113" width="198" height="70" rx="7" fill="#f3f6fa" stroke="#b3c2ce" />
    <text x="120" y="142" font-size="18" font-weight="700" text-anchor="middle">プラグイン</text>
    <text x="120" y="166" font-size="15" text-anchor="middle" style="fill:#52697b">要求を作る</text>
    <rect x="271" y="113" width="198" height="70" rx="7" fill="#f3f6fa" stroke="#b3c2ce" />
    <text x="370" y="142" font-size="18" font-weight="700" text-anchor="middle">⑤ 認証セッション</text>
    <text x="370" y="166" font-size="15" text-anchor="middle" style="fill:#52697b">コアが管理</text>
    <rect x="511" y="113" width="198" height="70" rx="7" fill="#f3f6fa" stroke="#b3c2ce" />
    <text x="610" y="142" font-size="18" font-weight="700" text-anchor="middle">AuthFlow</text>
    <text x="610" y="166" font-size="15" text-anchor="middle" style="fill:#52697b">サイト固有の手順</text>
    <rect x="791" y="113" width="198" height="70" rx="7" fill="#f3f6fa" stroke="#b3c2ce" />
    <text x="890" y="142" font-size="18" font-weight="700" text-anchor="middle">⑥ HTTP / ④ jar</text>
    <text x="890" y="166" font-size="15" text-anchor="middle" style="fill:#52697b">共有クライアント</text>
    <rect x="1031" y="113" width="198" height="70" rx="7" fill="#f3f6fa" stroke="#b3c2ce" />
    <text x="1130" y="142" font-size="18" font-weight="700" text-anchor="middle">サーバー</text>
    <text x="1130" y="166" font-size="15" text-anchor="middle" style="fill:#52697b">応答を返す</text>
    <text x="300" y="356" font-size="18" font-weight="700">初回 initialize() / 更新時 refresh()（認証用通信は必要な場合のみ）</text>
    <text x="419" y="282" font-size="16">AuthMode・originを解決</text>
    <text x="939" y="611" font-size="16">⑦ jarを更新</text>
    <text x="630" y="874" font-size="17" text-anchor="middle">VALID → 続行 / INVALID → refresh()</text>
    <text x="630" y="900" font-size="17" text-anchor="middle">UNKNOWN → AuthStateUnknownError</text>
    <text x="939" y="1202" font-size="16">⑦ jarを更新</text>
    <text x="419" y="1306" font-size="16">auth_receiptを付与</text>
    <rect x="40" y="1530" width="1160" height="83" rx="7" fill="#f3f6fa" stroke="#c3cfd8" />
    <text x="60" y="1562" font-size="18">AUTH_FAILURE → 必要なrefresh・回数制限付き再送。再送は元の要求から構築する。</text>
    <text x="60" y="1591" font-size="18">UNKNOWN → 追加verifyで判断。NOT_AUTH_FAILURE → 通常の応答処理へ進む。</text>
  </g>
</svg>