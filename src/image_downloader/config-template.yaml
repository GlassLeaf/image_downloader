# image-downloader user configuration
#
# This file is optional. Every setting below is commented out, so new bundled
# defaults continue to apply until you explicitly choose an override. Inspect
# active values and their source with: image-downloader config explain --json
#
# `null` is meaningful only where documented: roots use the platform default,
# optional limits are disabled, and optional network limits inherit their
# corresponding default. Lists and scalar values replace lower-priority layers;
# mappings merge recursively.
#
# profile:
#   default: default                 # letters, numbers, _ and - only
# storage:
#   data_root: null                  # null or absolute path; platform user-data root when null
# plugins:
#   root: null                       # null or absolute path; <data-root>/plugins when null
# download:
#   chapter_concurrency: 3           # integer >= 1
#   image_concurrency_per_chapter: 8 # integer >= 1; fetch/process/save jobs per chapter
#   continue_on_image_error: true
#   allow_empty_chapter_manifest: false
# output:
#   directory_format: '%NUM%_%TITLE%_%SUBTITLE%'
#   filename_format: '%NUM%.%EXT%'
#   existing_file: overwrite         # overwrite, skip, rename, error
#   image_format: JPEG               # JPEG, PNG, WEBP
#   isolate_by_plugin: false
#   max_component_length: null       # null or integer >= 16
#   lock_timeout_seconds: 30         # finite number >= 0; 0 means do not wait
# media:
#   input_validation: content_type   # content_type, decode, both
#   content_type_mismatch: accept    # accept, error
#   max_image_pixels: null           # null or integer >= 1
# logging:
#   console:
#     enabled: true
#   safe_query_parameters: []
#   safe_fragment_parameters: []
# network:
#   request_concurrency: 8           # total in-flight HTTP requests; integer >= 1
#   origin_request_concurrency: null # null or integer from 1 through request_concurrency
#   registrable_domain_request_concurrency: null # null or integer from 1 through request_concurrency
#   request_timeout_seconds: 30      # finite number > 0; default for phase timeouts
#   connect_timeout_seconds: null    # null inherits request_timeout_seconds
#   read_timeout_seconds: null
#   write_timeout_seconds: null
#   pool_timeout_seconds: null
#   max_attempts: 3                  # initial request included; 1 disables retries
#   retry_max_delay_seconds: 30      # finite number >= 0; 0 means no retry wait
#   auth_refresh_attempts: 1         # integer >= 0
#   global_request_interval_seconds: 0 # finite number >= 0; request-start interval across all origins
#   pool_max_connections: 8          # integer >= 1
#   pool_max_idle_connections: 8     # integer from 0 through pool_max_connections
#   max_response_bytes: 67108864     # integer >= 1
#   http2: true
#   follow_redirects: true
#   proxy: null
#   headers:
#     User-Agent: image-downloader/0.0.0.1b0
# notification:
#   enabled: false
#   methods: [desktop]               # desktop, email
#   notify_on: [fetch_error, process_error, save_error, auth_error]
#   routes: {}                       # category -> [desktop, email]
#   desktop: {}
#   email:
#     smtp_host: ''
#     smtp_port: 465                 # integer 1 through 65535
#     use_tls: true
#     from: ''
#     to: []
#     username: ''
#     credential_service: image-downloader.smtp
# security:
#   plugin_verification: strict      # strict, warn, off
# image_processors:
#   chain: []
# plugin_settings:
#   com.example.plugin:
#     enabled: true
#     config: {}                     # plugin-defined; validate with doctor --host
#     secrets: {}                    # lower_snake_case -> UPPERCASE_REFERENCE
# fallback:
#   generic_html:
#     enabled: true
