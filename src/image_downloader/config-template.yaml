# image-downloader user configuration
#
# This file is optional. Every setting below is commented out, so new bundled
# defaults continue to apply until you explicitly choose an override. Inspect
# active values and their source with: image-downloader config explain --json
#
# `null` is meaningful only where documented: roots use the platform default,
# optional limits are disabled, and optional network limits inherit their
# corresponding default. Lists and scalar values replace lower-priority layers;
# mappings merge recursively.
#
# profile:
#   default: default                 # letters, numbers, _ and - only
# storage:
#   data_root: null                  # null or absolute path; platform user-data root when null
# plugins:
#   root: null                       # null or absolute path; <data-root>/plugins when null
# download:
#   chapter_concurrency: 3           # integer >= 1
#   image_concurrency_per_chapter: 8 # integer >= 1; fetch/process/save jobs per chapter
#   continue_on_image_error: true
#   # Retained for compatibility; future cleanup timing and migration are undecided.
#   allow_empty_chapter_manifest: false
# output:
#   directory_format: '%CHAPTER_NUMBER%_%CONTENT_TITLE%_%CHAPTER_TITLE%'
#   filename_format: '%IMAGE_INDEX%.%EXT%'
#   existing_file: overwrite         # overwrite, skip, rename, error
#   image_format: null               # null, ORIGINAL, JPEG, PNG, WEBP; operation arguments take precedence
#   isolate_by_plugin: false
#   max_component_length: null       # null or integer >= 16
#   lock_timeout_seconds: 30         # finite number >= 0; 0 means do not wait
# media:
#   transform_workers: 2              # integer 1..4; shared image transform workers
#   input_validation: both           # content_type, decode, both; decode/both load every frame
#   content_type_mismatch: accept    # accept, error
#   max_image_pixels: null           # null or integer >= 1
# logging:
#   console:
#     enabled: true
#   safe_query_parameters: []
#   safe_fragment_parameters: []
# network:
#   request_concurrency: 8           # total in-flight HTTP requests; integer >= 1
#   origin_request_concurrency: null # null or integer from 1 through request_concurrency
#   registrable_domain_request_concurrency: null # null or integer from 1 through request_concurrency
#   request_timeout_seconds: 30      # finite number > 0; default for phase timeouts
#   connect_timeout_seconds: null    # null inherits request_timeout_seconds
#   read_timeout_seconds: null
#   write_timeout_seconds: null
#   pool_timeout_seconds: null
#   max_attempts: 3                  # initial request included; 1 disables retries
#   retry_max_delay_seconds: 30      # finite number >= 0; 0 means no retry wait
#   auth_refresh_attempts: 1         # integer >= 0
#   global_request_interval_seconds: 0 # finite number >= 0; request-start interval across all origins
#   pool_max_connections: 8          # integer >= 1
#   pool_max_idle_connections: 8     # integer from 0 through pool_max_connections
#   max_response_bytes: 67108864     # integer >= 1
#   http2: true
#   follow_redirects: true
#   proxy: null
#   headers:
#     User-Agent: image-downloader/0.0.0.1b0
# notification:
#   enabled: false
#   methods: [desktop]               # desktop, email
#   notify_on: [fetch_error, process_error, save_error, auth_error]
#   routes: {}                       # category -> [desktop, email]
#   desktop: {}
#   email:
#     smtp_host: ''
#     smtp_port: 465                 # integer 1 through 65535
#     use_tls: true
#     from: ''
#     to: []
#     credential_reference: null
# Legacy SMTP fields username and credential_service are retained but unused.
# security:
#   plugin_verification: strict      # strict, warn, off
# image_processors:
#   chain: []
#   # processor ID -> selected site plugin IDs allowed to see raw image transport metadata
#   transport_metadata_access: {}
# plugin_settings:
#   com.example.plugin:
#     enabled: true
#     config: {}                     # plugin-defined; validate with doctor --host
#     host_groups:                   # user-only names -> DNS hostname arrays
#       default: []                  # referenced arrays must be non-empty
#     auth_access:                  # user-owned credential/login permissions
#       mode: standard              # anonymous: fresh command-only session
#       sites:
#         gallery:
#           origins: [https://gallery.example.test]
#           # origins: ["https://${host_groups.default}", "https://*.${host_groups.default}"]
#           # One shared site; wildcard matches one label and excludes the apex.
#           login: ask              # allow / ask / deny
#           secrets: {}             # lower_snake_case -> UPPERCASE_REFERENCE
#     authentication:
#       verify_on_start: false
#       verify_before_request: false
#       verify_interval_seconds: null
#       refresh_skew_seconds: 0
#     endpoints:
#       api:
#         origin: https://api.example.test
#         # origin may also be an array of HTTP(S) origins or patterns:
#         # origin: ["https://cdn.${operation.site_domain}", "https://*.images.${operation.site_domain}"]
#         # user-owned array: origin: "https://viewer.${host_groups.default}"
#         # config arrays expand explicitly, e.g. origin: "https://cdn.${config.supported_hosts}"
#         auth: session              # session or none; one authentication session per operation
#         verification:
#           before_request: false
#           interval_seconds: null
#     download_policy:               # core-owned limits for this selected site plugin
#       request_concurrency: null    # null or integer >= 1; capped by network.request_concurrency
#       chapter_concurrency: null    # null or integer >= 1; capped by download.chapter_concurrency
#       image_concurrency_per_chapter: null # null or integer >= 1; capped by download setting
#       preserve_image_start_order: false # force chapter/image concurrency to 1
# fallback:
#   generic_html:
#     enabled: true

# Profile-wide workflow execution summaries (positive integers).
# workflow_logging:
#   progress_enabled: true  # JSONL/text only; per-round plan files are always required.
# workflow_history:
#   max_age_days: 90
#   max_size_bytes: 104857600
