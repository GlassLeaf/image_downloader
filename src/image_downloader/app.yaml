profile:
  default: default
storage:
  data_root: 
plugins:
  root: 
output:
  directory_format: '%NUM%_%TITLE%_%SUBTITLE%'
  filename_format: '%NUM%.%EXT%'
  existing_file: overwrite
  image_format: JPEG
  isolate_by_plugin: false
  max_component_length: null
  lock_timeout_seconds: 30
media:
  input_validation: content_type
  content_type_mismatch: accept
  max_image_pixels: null
logging:
  console:
    enabled: true
  safe_query_parameters: []
  safe_fragment_parameters: []
network:
  max_concurrency: 8
  max_chapter_concurrency: 3
  host_max_concurrency: null
  site_max_concurrency: null
  timeout_seconds: 30
  connect_timeout_seconds: null
  read_timeout_seconds: null
  write_timeout_seconds: null
  pool_timeout_seconds: null
  max_retries: 3
  max_retry_wait_seconds: 30
  max_auth_retries: 1
  request_interval_seconds: 0
  max_connections: 8
  max_keepalive_connections: 20
  max_response_bytes: 67108864
  http2: true
  follow_redirects: true
  proxy: null
  headers:
    User-Agent: image-downloader/0.0.0.1b0
notification:
  enabled: false
  methods:
  - desktop
  notify_on:
  - fetch_error
  - process_error
  - save_error
  - auth_error
  routes: {}
  desktop: {}
  email:
    smtp_host: ''
    smtp_port: 465
    use_tls: true
    from: ''
    to: []
    username: ''
    credential_service: image-downloader.smtp
security:
  plugin_verification: strict
image_processors:
  chain: []
plugin_settings: {}
fallback:
  generic_html:
    enabled: true
continue_on_error: true
allow_empty_manifest: false
