name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Record checkout identity
        shell: python
        env:
          VALIDATION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          import json
          import os
          import subprocess
          print(json.dumps({
              "head_sha": os.environ["VALIDATION_HEAD_SHA"],
              "checkout_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }))
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,parser]"
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m mypy src/image_downloader
      - name: Test with coverage and JUnit reports
        run: >-
          python -m pytest -q -ra --cov=image_downloader
          --cov-report=term-missing:skip-covered
          --cov-report=xml:.runtime/ci/coverage.xml
          --junitxml=.runtime/ci/junit.xml
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ matrix.os }}-py${{ matrix.python-version }}-attempt-${{ github.run_attempt }}
          path: |
            .runtime/ci/junit.xml
            .runtime/ci/coverage.xml
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  package-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Record checkout identity
        shell: python
        env:
          VALIDATION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          import json
          import os
          import subprocess
          print(json.dumps({
              "head_sha": os.environ["VALIDATION_HEAD_SHA"],
              "checkout_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }))
      - run: python -m pip install --upgrade pip build
      - run: python -m build --sdist --wheel
      - run: python tools/release_smoke.py
